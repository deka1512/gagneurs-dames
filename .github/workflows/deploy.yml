name: Gagneurs d'Âmes - Build and deploy to o2switch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation only (no files transferred)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Nuxt 4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt for production
        run: npm run build

      - name: Verify Nitro output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Prepare restricted deployment package
        run: |
          mkdir -p deploy/.output deploy/tmp
          cp -a .output/. deploy/.output/
          printf "import('./.output/server/index.mjs').catch((error) => { console.error(error); process.exit(1) })\\n" > deploy/server.js
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt
          echo "Deployment package:"
          find deploy -maxdepth 2 -type f | sort

      - name: Upload deployment package
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          local-dir: deploy/
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
